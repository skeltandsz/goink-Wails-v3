<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 移动端（Android WebView）参数：
         - viewport-fit=cover：内容延伸到刘海/挖孔区域，配合 index.css 的
           --safe-area-inset-* 变量自己留白，否则横屏时 notch 会盖住左侧工具栏。
         - maximum-scale=1 + user-scalable=no：这个界面是按桌面三栏工作台设计的，
           布局用 fixed 高度与 flex 填满，WebView 的手势缩放会让缩放后的视口与
           100dvh 计算脱节（表现为缩放后底部被裁、抽屉定位漂移）。代价是放弃
           浏览器级捏合缩放，可读性依赖应用内字号，这是有意的取舍。
         桌面平台这段 meta 无副作用（Electron/浏览器按 width=device-width 正常渲染）。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>goink-frontend</title>
  </head>
  <script>
    (function () {
      var t = localStorage.getItem('theme')
      if (t === 'dark' || (t === 'light')) {
        document.documentElement.setAttribute('data-theme', t)
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    })()
  </script>
  <script>
    // 首屏界面缩放：在首次绘制前写入 --goink-ui-scale，避免大→小闪烁。
    // 逻辑与 src/lib/uiScale.ts 保持一致（保守 ES5 写法，不 import 模块）：
    // 手动百分比（goink_ui_scale，30–120）优先，否则移动 UA 按 clamp(设备视口宽度 / 700, 0.35, 1)，桌面为 1。
    // 自适应宽度用 screen.width（不随 zoom 变化）；本脚本在写入 zoom 之前抓一次
    // innerWidth 存进 window.__goinkBaseWidth 作为后备基线，供 uiScale.ts 复用。
    // 修改公式/常量时请同步修改两处。
    (function () {
      // 此刻还没应用任何 zoom，innerWidth 就是真实的设备视口宽度（dp）
      window.__goinkBaseWidth = window.innerWidth
      var s = null
      try {
        var raw = localStorage.getItem('goink_ui_scale')
        if (raw !== null && raw !== 'auto') {
          var p = parseFloat(raw)
          if (!isNaN(p) && p >= 30 && p <= 120) {
            s = p / 100
          }
        }
      } catch (e) {
        /* ignore */
      }
      if (s === null) {
        if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
          var base = (window.screen && window.screen.width > 0)
            ? window.screen.width
            : window.__goinkBaseWidth
          s = Math.min(1, Math.max(0.35, base / 700))
        } else {
          s = 1
        }
      }
      document.documentElement.style.setProperty('--goink-ui-scale', String(s))
    })()
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
