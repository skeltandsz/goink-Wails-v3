version: '3'

info:
  companyName: "sigpanic"
  productName: "Goink"
  productIdentifier: "com.sigpanic.goink"
  description: "Goink - AI 小说创作助手"
  copyright: "Copyright © 2026 sigpanic"
  comments: "Goink - AI 小说创作助手"
  version: "1.6.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations:

other:
  - name: Goink
